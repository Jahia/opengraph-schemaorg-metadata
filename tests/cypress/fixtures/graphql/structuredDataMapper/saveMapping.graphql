mutation saveOpenGraphMapping(
    $path: String!
    $nodeType: String!
    $templateName: String
    $ogType: String!
    $properties: [InputOpenGraphPropertyMapping]!
    $schemaType: String
    $schemaProperties: [InputSchemaOrgPropertyMapping]
) {
    jcr {
        mutateNode(pathOrId: $path) {
            saveOpenGraphMapping(
                nodeType: $nodeType
                templateName: $templateName
                ogType: $ogType
                properties: $properties
                schemaType: $schemaType
                schemaProperties: $schemaProperties
            )
        }
    }
}
