mutation structuredDataMapperAddMappingNode($path: String!, $name: String!, $nodeType: String!) {
    jcr {
        mutateNode(pathOrId: $path) {
            addChild(
                name: $name
                primaryNodeType: "sdmnt:typeMapping"
                properties: [{name: "sdm:nodeType", value: $nodeType}, {name: "sdm:templateName", value: "*"}]
            ) {
                uuid
            }
        }
    }
}
