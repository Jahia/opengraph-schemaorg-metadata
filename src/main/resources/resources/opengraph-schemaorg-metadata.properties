fieldset.openGraph.description=Switch it on to write the Open Graph tags of the live page: the properties of every og\:type, the og\:type, then the properties of that type. Switched off, the page has no Open Graph tag and no twitter\:card, so a social network shows no rich card.
fieldset.schemaOrg=schema.org
fieldset.schemaOrg.description=Switch it on to write a JSON-LD block in the head of the live page: its schema.org type, then the schema.org properties of that type.
fieldset.openGraphValues=Open Graph
fieldset.openGraphValues.description=The Open Graph tags of this content in the edit workspace, in the current language: the saved values, not those of the live page. A text field of the mapping updates its tag as you type. Other changes show after you save.
